interface:
  display_name: "Herdr 标题提炼"
  short_description: "跨 agent 提炼当前目标并更新 Herdr 标题"
  default_prompt: "检查并维护 Herdr Title Distill 跨 harness 智能命名服务；先运行隔离验证，涉及真实完成触发或 pane/tab 行为时运行 --live --all-harnesses。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
activation:
  mode: "semantic"
  paths: []
execution:
  context: "inline"
  shell: "bash"
  trust:
    source_tier: "local"
remote_inline_execution: "forbid"
remote_metadata_policy: "allow-metadata-only"
degradation:
  openai: "native-agent-skill-with-local-herdr-service"
